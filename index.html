<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Repositorio personal de recursos, comandos, herramientas, guias y documentacion.">
    <title>Mis Webs</title>
    <link rel="stylesheet" href="src/styles/main.css">
    <script type="module" src="src/scripts/app.js"></script>
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" data-sidebar>
        <div class="brand">
          <a class="brand-link" href="#/" aria-label="Mis Webs inicio">
            <img class="brand-logo" src="assets/images/raim-logo.png" alt="">
            <span>
              <strong>Mis Webs</strong>
              <small>Recursos personales</small>
            </span>
          </a>
        </div>

        <nav class="side-nav" data-navigation aria-label="Categorias"></nav>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <button class="menu-button" type="button" data-mobile-menu aria-label="Abrir menu">
            <span></span>
            <span></span>
            <span></span>
          </button>

          <div class="search-shell">
            <label class="visually-hidden" for="global-search">Buscar</label>
            <input id="global-search" data-search type="search" autocomplete="off" placeholder="Buscar recursos, comandos, herramientas...">
          </div>

          <label class="visually-hidden" for="type-filter">Tipo</label>
          <select id="type-filter" class="type-filter" data-type-filter></select>

          <button class="button button-ghost clear-button" type="button" data-clear-filters hidden>Limpiar</button>
        </header>

        <main class="main-content" data-results></main>
      </div>
    </div>

    <dialog class="detail-dialog" data-detail-dialog aria-label="Detalle del recurso">
      <button class="dialog-close" type="button" data-close-dialog aria-label="Cerrar">&times;</button>
      <div data-dialog-content></div>
    </dialog>
  </body>
</html>
